# Release — replaces .github/workflows/ci.yml's release-please job.
# release-please only talks to the GitHub API, so this uses
# semantic-release + @semantic-release/gitlab instead (see .releaserc.json
# at the repo root). Mechanically different from release-please: a release
# lands directly on merge to main (no staged "release PR" to review
# first), and — since semantic-release computes one version per config,
# unlike release-please's manifest mode — the app and the Helm chart share
# a single unified version rather than two independent SemVer tracks.
#
# ⚠ REQUIRES a `GITLAB_TOKEN` CI/CD variable (Settings → CI/CD →
# Variables): a Project Access Token (or a bot Personal Access Token) with
# the `api` + `write_repository` scopes, and the `Maintainer` role so it
# can push the release commit + tag straight to the protected `main`
# branch (`CI_JOB_TOKEN` alone isn't reliably enough for this — mask +
# protect the variable).
release:
  stage: release
  image: node:22-slim
  interruptible: false # never cancel a release mid-flight
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
  variables:
    CRANE_VERSION: '0.20.2'
  before_script:
    - corepack enable
    - apt-get update && apt-get install -y --no-install-recommends git curl ca-certificates && rm -rf /var/lib/apt/lists/*
    - curl --retry 3 --retry-all-errors --retry-delay 3 https://mise.run | sh
    # Shims dir (not just ~/.local/bin) so `helm-docs` is directly callable
    # from .releaserc.json's prepareCmd, which semantic-release runs as a
    # plain shell command — it can't be wrapped in `mise exec --` itself.
    - export PATH="$HOME/.local/bin:$HOME/.local/share/mise/shims:$PATH"
    - mise install helm helm-docs
    # crane: a daemonless registry client (no docker/DinD needed) used
    # below to re-tag the already-built-and-scanned <sha> images to the
    # released version — never a rebuild, same principle as the GitHub
    # pipeline's `docker buildx imagetools create` promotion step.
    # Runner-architecture-aware: this project's fleet is arm64 (Raspberry
    # Pi), not x86_64.
    - |
      case "$(uname -m)" in
        x86_64) CRANE_ARCH=x86_64 ;;
        aarch64) CRANE_ARCH=arm64 ;;
        armv7l|armv6l) CRANE_ARCH=armv6 ;;
        *) echo "unsupported arch $(uname -m)" >&2; exit 1 ;;
      esac
    # --retry: this runner's network has shown transient DNS/connect blips
    # (e.g. curl exit 6, "Couldn't resolve host") on external downloads.
    - curl -sfL --retry 3 --retry-all-errors --retry-delay 3 -o /tmp/crane.tar.gz "https://github.com/google/go-containerregistry/releases/download/v${CRANE_VERSION}/go-containerregistry_Linux_${CRANE_ARCH}.tar.gz"
    - tar -xzf /tmp/crane.tar.gz -C /usr/local/bin crane
    - git remote set-url origin "https://gitlab-ci-token:${GITLAB_TOKEN}@${CI_SERVER_HOST}/${CI_PROJECT_PATH}.git"
  script:
    - pnpm install --frozen-lockfile
    - npx semantic-release
    - NEW_TAG=$(git tag --points-at HEAD | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' || true)
    - |
      if [ -z "$NEW_TAG" ]; then
        echo "No release published (no releasable commits since the last one) — nothing to promote."
        exit 0
      fi
    - VERSION="${NEW_TAG#v}"
    - CHART_VERSION="$(mise exec -- helm show chart deploy/helm/testcampaignshooter | awk '/^version:/{print $2}')"
    - mise exec -- helm registry login "$CI_REGISTRY" -u "$CI_REGISTRY_USER" -p "$CI_REGISTRY_PASSWORD"
    - mise exec -- helm package deploy/helm/testcampaignshooter -d dist
    - mise exec -- helm push "dist/testcampaignshooter-${CHART_VERSION}.tgz" "oci://${CHART_IMAGE}"
    - crane auth login "$CI_REGISTRY" -u "$CI_REGISTRY_USER" -p "$CI_REGISTRY_PASSWORD"
    - crane tag "${IMAGE_SERVER}:${CI_COMMIT_SHORT_SHA}" "$VERSION"
    - crane tag "${IMAGE_SERVER}:${CI_COMMIT_SHORT_SHA}" latest
    - crane tag "${IMAGE_PORTAL}:${CI_COMMIT_SHORT_SHA}" "$VERSION"
    - crane tag "${IMAGE_PORTAL}:${CI_COMMIT_SHORT_SHA}" latest
