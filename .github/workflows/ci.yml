# testcampaignshooter pipeline — orchestrator. Path filtering (`changes`)
# picks which reusable workflows run; ci-node.yml/ci-helm.yml/ci-images.yml
# stay independently reviewable, ci-security.yml is unconditional (a gate
# that can be skipped by touching the "right" files is not a gate).
#
#   PR:    selective gates (dorny/paths-filter drives the scopes) — Node
#          lint/typecheck/test/build + Prisma migration-drift + Helm lint/
#          unittest + security + image builds (NOT pushed, amd64 scanned
#          locally).
#   main:  same gates, ALWAYS everything (build-all invariant: release
#          promotion needs the full image/chart set at any taggable SHA)
#          — images pushed as <short-sha> (+ moving `edge`), SBOMs
#          generated, merged manifest scanned.
#   release: release-please (manifest mode, two independent packages — the
#          app root and the Helm chart) runs at the END of the main
#          pipeline. Merging the app release PR re-tags (never rebuilds)
#          the already-built-and-scanned <short-sha> images as the bare
#          X.Y.Z + `latest`, and attaches the SBOMs to the GitHub Release.
#          Merging the chart release PR packages + pushes the chart as an
#          OCI artifact. Chaining promotion in the SAME workflow run
#          (gated on the release_created outputs) sidesteps the
#          GITHUB_TOKEN anti-recursion rule — no PAT/App needed.
#
# Actions are pinned by tag today; Renovate (helpers:pinGitHubActionDigests
# in renovate.json) converts them to pinned commit digests automatically.

name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  REGISTRY: ghcr.io

jobs:
  # ------------------------------------------------------------------
  # Path filtering. PR pipelines are selective; push pipelines on main
  # force EVERYTHING (build-all invariant).
  # ------------------------------------------------------------------
  changes:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      node: ${{ steps.plan.outputs.node }}
      helm: ${{ steps.plan.outputs.helm }}
      images: ${{ steps.plan.outputs.images }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v4
        id: filter
        if: github.event_name == 'pull_request'
        with:
          filters: |
            ci: &ci
              - '.github/workflows/**'
              - '.mise.toml'
            node:
              - *ci
              - 'apps/**'
              - 'packages/**'
              - 'package.json'
              - 'pnpm-lock.yaml'
              - 'pnpm-workspace.yaml'
              - 'tsconfig.base.json'
              - 'eslint.config.js'
              - 'vitest.config.ts'
            helm:
              - *ci
              - 'deploy/helm/testcampaignshooter/**'
            image-server:
              - *ci
              - 'apps/server/**'
              - 'packages/**'
              - 'package.json'
              - 'pnpm-lock.yaml'
              - 'pnpm-workspace.yaml'
            image-portal:
              - *ci
              - 'apps/portal/**'
              - 'packages/shared-types/**'
              - 'package.json'
              - 'pnpm-lock.yaml'
              - 'pnpm-workspace.yaml'
      - name: Compose job plan
        id: plan
        env:
          EVENT: ${{ github.event_name }}
          F_NODE: ${{ steps.filter.outputs.node }}
          F_HELM: ${{ steps.filter.outputs.helm }}
          F_IMG_SERVER: ${{ steps.filter.outputs.image-server }}
          F_IMG_PORTAL: ${{ steps.filter.outputs.image-portal }}
        run: |
          set -euo pipefail
          if [ "$EVENT" = "push" ]; then
            F_NODE=true F_HELM=true F_IMG_SERVER=true F_IMG_PORTAL=true
          fi

          echo "node=${F_NODE}" >> "$GITHUB_OUTPUT"
          echo "helm=${F_HELM}" >> "$GITHUB_OUTPUT"

          img() { [ "$3" = "true" ] && printf '{"name":"%s","context":".","dockerfile":"%s"}\n' "$1" "$2" || true; }
          {
            img server apps/server/Dockerfile "$F_IMG_SERVER"
            img portal apps/portal/Dockerfile "$F_IMG_PORTAL"
          } | jq -cs . | sed 's/^/images=/' >> "$GITHUB_OUTPUT"

  # ------------------------------------------------------------------
  # Delegated domains — see ci-*.yml.
  # ------------------------------------------------------------------
  node:
    needs: changes
    if: needs.changes.outputs.node == 'true'
    uses: ./.github/workflows/ci-node.yml

  helm:
    needs: changes
    if: needs.changes.outputs.helm == 'true'
    uses: ./.github/workflows/ci-helm.yml

  # Unconditional on every PR and main push.
  security:
    uses: ./.github/workflows/ci-security.yml

  images:
    needs: changes
    if: needs.changes.outputs.images != '[]'
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/ci-images.yml
    with:
      images: ${{ needs.changes.outputs.images }}
      push: ${{ github.event_name == 'push' }}

  # ------------------------------------------------------------------
  # Release. release-please (manifest mode, two packages: "." the app —
  # SemVer drives image tags + Chart.yaml appVersion — and
  # "deploy/helm/testcampaignshooter", the chart's OWN independent
  # SemVer for its OCI artifact). needs: gates it on the full green
  # pipeline so a tag can only ever point at a releasable SHA.
  # ------------------------------------------------------------------
  release-please:
    needs: [node, helm, security, images]
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    outputs:
      release_created: ${{ steps.rp.outputs.release_created }}
      tag_name: ${{ steps.rp.outputs.tag_name }}
      chart_release_created: ${{ steps.rp.outputs['deploy/helm/testcampaignshooter--release_created'] }}
      chart_tag_name: ${{ steps.rp.outputs['deploy/helm/testcampaignshooter--tag_name'] }}
    steps:
      - uses: googleapis/release-please-action@v5
        id: rp
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  # Promotion of already-tested artifacts, never a rebuild: re-tag the
  # <short-sha> images (built+scanned by the images job on this same
  # commit) as the bare X.Y.Z + `latest`, then attach the CycloneDX SBOMs
  # (ci-images.yml's sbom job) to the GitHub Release.
  images-release:
    needs: [release-please, images]
    if: needs.release-please.outputs.release_created == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write # edit the Release
      packages: write # push the X.Y.Z/latest image tags
    env:
      COMPONENTS: server portal
      TAG: ${{ needs.release-please.outputs.tag_name }}
    steps:
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Re-tag images (no rebuild)
        run: |
          set -euo pipefail
          SHORT="${GITHUB_SHA::7}"
          VERSION="${TAG#v}"
          for c in $COMPONENTS; do
            IMAGE="$REGISTRY/${GITHUB_REPOSITORY,,}/$c"
            docker buildx imagetools create -t "$IMAGE:$VERSION" "$IMAGE:$SHORT"
            docker buildx imagetools create -t "$IMAGE:latest" "$IMAGE:$VERSION"
          done
      - uses: actions/download-artifact@v4
        with:
          pattern: sbom-*
          merge-multiple: true
          path: sboms
      - name: Attach SBOMs to the GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "$TAG" sboms/*.cdx.json --clobber --repo "$GITHUB_REPOSITORY"

  # Independent OCI publish of the chart, gated on the chart package's OWN
  # release (its SemVer, not the app's). No repackage-with-override: the
  # committed Chart.yaml at the tagged SHA IS the release.
  chart-release:
    needs: release-please
    if: needs.release-please.outputs.chart_release_created == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      CHART_DIR: deploy/helm/testcampaignshooter
    steps:
      - uses: actions/checkout@v4
      - uses: jdx/mise-action@v4
        with:
          install_args: helm # version pinned in .mise.toml
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Package and push the chart
        run: |
          set -euo pipefail
          echo "${{ secrets.GITHUB_TOKEN }}" | helm registry login "$REGISTRY" -u "${{ github.actor }}" --password-stdin
          CHART_VERSION="$(helm show chart "$CHART_DIR" | awk '/^version:/{print $2}')"
          helm package "$CHART_DIR" -d dist
          helm push dist/testcampaignshooter-*.tgz "oci://$REGISTRY/${GITHUB_REPOSITORY,,}/charts"
          docker buildx imagetools create \
            -t "$REGISTRY/${GITHUB_REPOSITORY,,}/charts/testcampaignshooter:latest" \
            "$REGISTRY/${GITHUB_REPOSITORY,,}/charts/testcampaignshooter:$CHART_VERSION"
