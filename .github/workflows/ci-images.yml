# Image builds — called by ci.yml with the set of {name, context,
# dockerfile} components to build (server, portal). One native amd64 leg
# + one arm64 leg via QEMU (both on ubuntu-latest — no native-ARM runner).
# PR (inputs.push=false): build only, nothing pushed, the amd64 image is
# scanned locally. main (inputs.push=true): push <sha>-<arch>, merge into
# a <sha> manifest list + moving `latest`, generate a CycloneDX SBOM per
# component (uploaded as a workflow artifact — ci.yml's images-release
# job attaches it to the GitHub Release on an app release), then a
# blocking Trivy scan of the merged manifest before release-please can
# fire.

name: ci-images

on:
  workflow_call:
    inputs:
      images:
        description: JSON array of {name, context, dockerfile} to build.
        required: true
        type: string
      push:
        description: Push/scan-the-manifest-list mode (main) vs build-only (PR).
        required: true
        type: boolean

env:
  REGISTRY: ghcr.io

permissions:
  contents: read

jobs:
  build-images:
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        component: ${{ fromJson(inputs.images) }}
        arch: [amd64, arm64]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - id: vars
        run: |
          echo "repo=${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
          echo "sha=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-qemu-action@v3
        if: matrix.arch == 'arm64'
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        if: inputs.push
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.component.context }}
          file: ${{ matrix.component.dockerfile }}
          platforms: linux/${{ matrix.arch }}
          push: ${{ inputs.push }}
          load: ${{ !inputs.push }}
          # provenance would wrap the per-arch tag in an attestation
          # manifest list and confuse the imagetools merge below.
          provenance: false
          tags: ${{ env.REGISTRY }}/${{ steps.vars.outputs.repo }}/${{ matrix.component.name }}:${{ steps.vars.outputs.sha }}-${{ matrix.arch }}
          cache-from: type=gha,scope=${{ matrix.component.name }}-${{ matrix.arch }}
          cache-to: type=gha,scope=${{ matrix.component.name }}-${{ matrix.arch }},mode=max,ignore-error=true
      - name: Scan image (PR gate — on main the merged manifest is scanned)
        if: ${{ !inputs.push && matrix.arch == 'amd64' }}
        uses: aquasecurity/trivy-action@0.36.0
        with:
          image-ref: ${{ env.REGISTRY }}/${{ steps.vars.outputs.repo }}/${{ matrix.component.name }}:${{ steps.vars.outputs.sha }}-${{ matrix.arch }}
          scanners: vuln,secret
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: '1'

  merge-manifests:
    needs: build-images
    if: inputs.push
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        component: ${{ fromJson(inputs.images) }}
    steps:
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Assemble manifest list
        run: |
          set -euo pipefail
          SHORT="${GITHUB_SHA::7}"
          IMAGE="$REGISTRY/${GITHUB_REPOSITORY,,}/${{ matrix.component.name }}"
          docker buildx imagetools create -t "$IMAGE:$SHORT" "$IMAGE:$SHORT-amd64" "$IMAGE:$SHORT-arm64"
          # Moving `edge` tag: convenience pointer for dev/manual pulls,
          # never a deploy reference. `latest` only ever points at the
          # newest OFFICIAL release (see ci.yml's images-release job).
          docker buildx imagetools create -t "$IMAGE:edge" "$IMAGE:$SHORT"

  # CycloneDX SBOM per component, generated from the concrete amd64 image
  # (not the manifest list, to avoid ambiguity) and uploaded as a workflow
  # artifact. ci.yml's images-release job downloads these and attaches
  # them to the GitHub Release when an app release is cut.
  sbom:
    needs: merge-manifests
    if: inputs.push
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    strategy:
      fail-fast: false
      matrix:
        component: ${{ fromJson(inputs.images) }}
    steps:
      - id: vars
        run: |
          echo "repo=${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
          echo "sha=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
      - name: Generate CycloneDX SBOM
        uses: aquasecurity/trivy-action@0.36.0
        env:
          TRIVY_USERNAME: ${{ github.actor }}
          TRIVY_PASSWORD: ${{ secrets.GITHUB_TOKEN }}
        with:
          image-ref: ${{ env.REGISTRY }}/${{ steps.vars.outputs.repo }}/${{ matrix.component.name }}:${{ steps.vars.outputs.sha }}-amd64
          format: cyclonedx
          output: sbom-${{ matrix.component.name }}.cdx.json
      - uses: actions/upload-artifact@v4
        with:
          name: sbom-${{ matrix.component.name }}
          path: sbom-${{ matrix.component.name }}.cdx.json
          retention-days: 90

  scan-images:
    needs: merge-manifests
    if: inputs.push
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    strategy:
      fail-fast: false
      matrix:
        component: ${{ fromJson(inputs.images) }}
    steps:
      - id: vars
        run: |
          echo "repo=${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
          echo "sha=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
      - uses: aquasecurity/trivy-action@0.36.0
        env:
          TRIVY_USERNAME: ${{ github.actor }}
          TRIVY_PASSWORD: ${{ secrets.GITHUB_TOKEN }}
        with:
          image-ref: ${{ env.REGISTRY }}/${{ steps.vars.outputs.repo }}/${{ matrix.component.name }}:${{ steps.vars.outputs.sha }}
          scanners: vuln,secret
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: '1'
