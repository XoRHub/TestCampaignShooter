# Blocking security gates — called by ci.yml unconditionally on every PR
# and main push: a gate that can be skipped by touching the "right" files
# is not a gate. Per-image vulnerability scanning and SBOM generation live
# in ci-images.yml instead (they need the built image, not just the
# source tree).

name: ci-security

on:
  workflow_call: {}

permissions:
  contents: read

jobs:
  trivy-fs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: trivy fs (pnpm-lock.yaml vulnerability gate)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: '1'

  hadolint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: hadolint
        run: |
          docker run --rm -v "$PWD:/work" -w /work hadolint/hadolint:v2.12.0-alpine \
            hadolint --failure-threshold warning --config .hadolint.yaml \
            apps/server/Dockerfile apps/portal/Dockerfile
