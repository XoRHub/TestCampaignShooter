suite: Argo RBAC (ServiceAccounts, Roles, RoleBindings)
templates:
  - rbac.yaml
tests:
  - it: creates the workflow ServiceAccount in the argo namespace
    documentIndex: 0
    asserts:
      - equal:
          path: kind
          value: ServiceAccount
      - equal:
          path: metadata.name
          value: testcampaignshooter
      - equal:
          path: metadata.namespace
          value: argo

  - it: grants the orchestrator Role full workflow CRUD + pod/secret read in the argo namespace
    documentIndex: 1
    asserts:
      - equal:
          path: kind
          value: Role
      - equal:
          path: metadata.name
          value: testcampaignshooter-orchestrator
      - equal:
          path: metadata.namespace
          value: argo
      - contains:
          path: rules
          content:
            apiGroups: ['argoproj.io']
            resources: ['workflows', 'workflowtemplates']
            verbs: ['create', 'get', 'list', 'watch', 'update', 'patch', 'delete']
      - contains:
          path: rules
          content:
            apiGroups: ['']
            resources: ['pods', 'pods/log']
            verbs: ['get', 'list', 'watch']

  - it: binds the orchestrator Role to both the workflow SA and the server SA (cross-namespace)
    documentIndex: 2
    asserts:
      - equal:
          path: kind
          value: RoleBinding
      - equal:
          path: metadata.name
          value: testcampaignshooter-orchestrator
      - equal:
          path: roleRef.name
          value: testcampaignshooter-orchestrator
      - contains:
          path: subjects
          content:
            kind: ServiceAccount
            name: testcampaignshooter
            namespace: argo
      - contains:
          path: subjects
          content:
            kind: ServiceAccount
            name: testcampaignshooter-server
            namespace: NAMESPACE

  - it: grants the workflow Role permission to report task results
    documentIndex: 3
    asserts:
      - equal:
          path: kind
          value: Role
      - equal:
          path: metadata.name
          value: testcampaignshooter-workflow
      - equal:
          path: rules[0].resources[0]
          value: workflowtaskresults
      - equal:
          path: rules[0].verbs
          value: ['create', 'patch']

  - it: binds the workflow Role to the workflow ServiceAccount only
    documentIndex: 4
    asserts:
      - equal:
          path: kind
          value: RoleBinding
      - equal:
          path: metadata.name
          value: testcampaignshooter-workflow
      - equal:
          path: subjects
          value:
            - kind: ServiceAccount
              name: testcampaignshooter
              namespace: argo

  - it: creates the server ServiceAccount in the release namespace
    documentIndex: 5
    asserts:
      - equal:
          path: kind
          value: ServiceAccount
      - equal:
          path: metadata.name
          value: testcampaignshooter-server
      - equal:
          path: metadata.namespace
          value: NAMESPACE

  - it: honors an overridden argo namespace and service account name
    set:
      argo.namespace: my-argo
      argo.serviceAccount: my-tcs-sa
    documentIndex: 0
    asserts:
      - equal:
          path: metadata.name
          value: my-tcs-sa
      - equal:
          path: metadata.namespace
          value: my-argo
