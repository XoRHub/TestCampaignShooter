{{- if .Values.postgresql.enabled }}
# Dev-grade PostgreSQL — use a managed database in production.
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ .Release.Name }}-postgresql
spec:
  serviceName: {{ .Release.Name }}-postgresql
  replicas: 1
  selector:
    matchLabels: { app.kubernetes.io/name: tcs-postgresql }
  template:
    metadata:
      labels: { app.kubernetes.io/name: tcs-postgresql }
    spec:
      containers:
        - name: postgresql
          image: {{ .Values.postgresql.image }}
          env:
            - name: POSTGRES_DB
              value: {{ .Values.postgresql.database }}
            - name: POSTGRES_USER
              value: {{ .Values.postgresql.username }}
            - name: POSTGRES_PASSWORD
              value: {{ .Values.postgresql.password }}
          ports:
            - containerPort: 5432
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ['ReadWriteOnce']
        resources:
          requests:
            storage: {{ .Values.postgresql.storage }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-postgresql
spec:
  selector: { app.kubernetes.io/name: tcs-postgresql }
  ports:
    - port: 5432
{{- end }}
{{- if .Values.minio.enabled }}
---
# Dev-grade MinIO — also serves as the Argo artifact repository backend.
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ .Release.Name }}-minio
spec:
  serviceName: {{ .Release.Name }}-minio
  replicas: 1
  selector:
    matchLabels: { app.kubernetes.io/name: tcs-minio }
  template:
    metadata:
      labels: { app.kubernetes.io/name: tcs-minio }
    spec:
      containers:
        - name: minio
          image: {{ .Values.minio.image }}
          args: ['server', '/data', '--console-address', ':9001']
          env:
            - name: MINIO_ROOT_USER
              value: {{ .Values.minio.rootUser }}
            - name: MINIO_ROOT_PASSWORD
              value: {{ .Values.minio.rootPassword }}
          ports:
            - containerPort: 9000
            - containerPort: 9001
          volumeMounts:
            - name: data
              mountPath: /data
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ['ReadWriteOnce']
        resources:
          requests:
            storage: {{ .Values.minio.storage }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-minio
spec:
  selector: { app.kubernetes.io/name: tcs-minio }
  ports:
    - name: api
      port: 9000
    - name: console
      port: 9001
{{- end }}
