apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-server
  labels: { app.kubernetes.io/name: tcs-server }
spec:
  replicas: {{ .Values.server.replicas }}
  selector:
    matchLabels: { app.kubernetes.io/name: tcs-server }
  template:
    metadata:
      labels: { app.kubernetes.io/name: tcs-server }
    spec:
      serviceAccountName: testcampaignshooter-server
      containers:
        - name: server
          image: '{{ .Values.image.registry }}/server:{{ .Values.image.tag }}'
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - containerPort: {{ .Values.server.port }}
          env:
            - name: PORT
              value: '{{ .Values.server.port }}'
            - name: PUBLIC_BASE_URL
              value: {{ .Values.server.publicBaseUrl | quote }}
            - name: LOG_LEVEL
              value: {{ .Values.server.logLevel | quote }}
            - name: K8S_NAMESPACE
              value: {{ .Values.argo.namespace | quote }}
            - name: ARGO_SERVICE_ACCOUNT
              value: {{ .Values.argo.serviceAccount | quote }}
            - name: ARGO_SERVER_URL
              value: {{ .Values.argo.serverUrl | quote }}
            - name: ARGO_ARTIFACT_PREFIX
              value: {{ .Values.argo.artifactPrefix | quote }}
            {{- if .Values.argo.gitSecretName }}
            - name: ARGO_GIT_SECRET_NAME
              value: {{ .Values.argo.gitSecretName | quote }}
            {{- end }}
            {{- range $key, $value := .Values.server.env }}
            - name: {{ $key }}
              value: {{ $value | quote }}
            {{- end }}
          envFrom:
            - secretRef:
                name: {{ .Values.server.existingSecret }}
          readinessProbe:
            httpGet: { path: /readyz, port: {{ .Values.server.port }} }
            initialDelaySeconds: 5
          livenessProbe:
            httpGet: { path: /healthz, port: {{ .Values.server.port }} }
            initialDelaySeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-server
spec:
  selector: { app.kubernetes.io/name: tcs-server }
  ports:
    - port: {{ .Values.server.port }}
      targetPort: {{ .Values.server.port }}
