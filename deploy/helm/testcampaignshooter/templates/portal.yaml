apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-portal
  labels: { app.kubernetes.io/name: tcs-portal }
spec:
  replicas: {{ .Values.portal.replicas }}
  selector:
    matchLabels: { app.kubernetes.io/name: tcs-portal }
  template:
    metadata:
      labels: { app.kubernetes.io/name: tcs-portal }
    spec:
      containers:
        - name: portal
          image: '{{ .Values.image.registry }}/portal:{{ .Values.image.tag }}'
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - containerPort: {{ .Values.portal.port }}
          readinessProbe:
            httpGet: { path: /login, port: {{ .Values.portal.port }} }
            initialDelaySeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-portal
spec:
  selector: { app.kubernetes.io/name: tcs-portal }
  ports:
    - port: {{ .Values.portal.port }}
      targetPort: {{ .Values.portal.port }}
